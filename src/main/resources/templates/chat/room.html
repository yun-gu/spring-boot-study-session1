<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>Spring Study - Chat Room</title>
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
  <link rel="stylesheet" th:href="@{/static/style.css}">
</head>

<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" th:href="@{/}">Spring Study</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" th:href="@{/}">홈</a></li>
          <li class="nav-item"><a class="nav-link active" th:href="@{/chat/enterence}">채팅</a></li>
          <li class="nav-item"><a class="nav-link" th:href="@{/board}">게시판</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container chat-container">
    <div class="card">
      <div class="card-header chat-header fw-bold">
        💬 실시간 채팅방
        <span id="current-user-display" class="badge bg-light text-dark ms-2" th:text="${username}"></span>
      </div>

      <div class="card-body" id="chat-box">
      </div>

      <div class="card-footer bg-white p-3">
        <div class="input-group">
          <input type="text" id="message-input" class="form-control border-0 bg-light" placeholder="메시지를 입력하세요..."
            aria-label="Message">
          <button class="btn btn-primary" type="button" id="send-button">전송 🚀</button>
        </div>
      </div>
    </div>
  </div>

  <script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>

  <script th:inline="javascript">
    /* <![CDATA[ */
    let currentUsername = /*[[ ${username} ]]*/'';

    const chatBox = document.getElementById('chat-box');
    const messageInput = document.getElementById('message-input');
    const sendButton = document.getElementById('send-button');

    document.addEventListener('DOMContentLoaded', function () {
      // 메시지 전송 이벤트 연결 (버튼 클릭 및 엔터키)
      sendButton.addEventListener('click', sendMessage);
      messageInput.addEventListener('keypress', function (e) {
        if (e.key === 'Enter') sendMessage();
      });

      initDummyData();
    });

    function renderMessage(sender, message, isMine) {
      // 내 메시지면 오른쪽 정렬(d-flex justify-content-end), 아니면 왼쪽 정렬
      const alignmentClass = isMine ? 'my-message d-flex justify-content-end' : 'other-message d-flex justify-content-start';

      const messageHTML = `
            <div class="message-item w-100 ${alignmentClass}">
                <div style="max-width: 75%;">
                    <div class="sender-name">${sender}</div>
                    <div class="message-bubble shadow-sm">
                        ${message}
                    </div>
                </div>
            </div>
        `;

      chatBox.insertAdjacentHTML('beforeend', messageHTML);
      scrollToBottom();
    }


    function sendMessage() {
      const message = messageInput.value.trim();
      if (message === '' || currentUsername === null) return;

      // 내가 쓴 메시지는 오른쪽에 표시 (isMine = true)
      // 추후 이 부분에서 웹소켓으로 메시지를 전송하게 됩니다.
      renderMessage(currentUsername, message, true);

      messageInput.value = '';
    }


    function scrollToBottom() {
      chatBox.scrollTop = chatBox.scrollHeight;
    }


    // 더미 데이터 로드 (테스트용)
    function initDummyData() {
      setTimeout(() => {
        renderMessage('철수', `안녕하세요! ${currentUsername}님 반가워요.`, false);
      }, 1500);

      setTimeout(() => {
        renderMessage('영희', '오~ 인터페이스 깔끔하네요 ㅎㅎ', false);
      }, 2500);
    }

    /*]]>*/
  </script>
</body>

</html>
