<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>Spring Study - Board</title>
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
</head>

<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-5">
    <div class="container">
      <a class="navbar-brand" th:href="@{/}">Spring Study</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" th:href="@{/}">홈</a></li>
          <li class="nav-item"><a class="nav-link active" th:href="@{/board}">게시판</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8">

        <div class="card shadow-sm border-0">
          <div class="card-header bg-white py-3">
            <h4 class="mb-0 fw-bold">✏️ 게시글 작성</h4>
          </div>
          <div class="card-body p-4">

            <form th:action="@{/board/save}" method="post">

              <div class="mb-3">
                <label for="writer" class="form-label fw-bold">작성자</label>
                <input type="text" class="form-control" id="writer" name="writer" placeholder="이름을 입력하세요" required>
              </div>

              <div class="mb-3">
                <label for="title" class="form-label fw-bold">제목</label>
                <input type="text" class="form-control" id="title" name="title" placeholder="제목을 입력하세요" required>
              </div>

              <div class="mb-4">
                <label for="content" class="form-label fw-bold">내용</label>
                <textarea class="form-control" id="content" rows="5"
                  placeholder="내용을 입력하세요 (현재는 제목/작성자만 저장됩니다)"></textarea>
              </div>

              <div class="d-flex justify-content-end gap-2">
                <a th:href="@{/board}" class="btn btn-secondary">취소</a>
                <button type="submit" class="btn btn-primary">등록하기</button>
              </div>

            </form>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>
</body>

</html>
